name: Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.2.0
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION to continue
        required: true
        type: string
      approval_token:
        description: Control API production approval token
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-environment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "DEPLOY_PRODUCTION"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

  test-server:
    needs: validate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-password
          MYSQL_DATABASE: tmk_test
          MYSQL_USER: tmk_test
          MYSQL_PASSWORD: integration-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utmk_test -pintegration-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TMK_TEST_MYSQL_DSN: tmk_test:integration-password@tcp(127.0.0.1:3306)/tmk_test?parseTime=true
    defaults:
      run:
        working-directory: TMK-Glance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Glance/go.mod
          cache-dependency-path: TMK-Glance/go.sum
      - run: go test -race ./...

  admin-test:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TMK-Admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: TMK-Admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check and build production admin
        env:
          ADMIN_BASE_PATH: /tmk-admin/
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: tmk-admin-production-dist
          path: TMK-Glance/internal/adminui/dist
          if-no-files-found: error
          retention-days: 7

  monitor-test:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TMK-Monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Monitor/go.mod
      - run: go test ./...
      - name: Build Linux monitor
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: mkdir -p ../dist && go build -trimpath -ldflags="-s -w" -o ../dist/tmk-monitor .
      - uses: actions/upload-artifact@v7
        with:
          name: tmk-monitor-production
          path: dist/tmk-monitor
          if-no-files-found: error
          retention-days: 7

  control-api-test:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TMK-Admin-API
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Admin-API/go.mod
      - run: go test -race ./...
      - name: Build Linux admin api
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: mkdir -p ../dist && go build -trimpath -ldflags="-s -w" -o ../dist/tmk-control-api .
      - uses: actions/upload-artifact@v7
        with:
          name: tmk-control-api-production
          path: dist/tmk-control-api
          if-no-files-found: error
          retention-days: 7

  build-server:
    needs: [test-server, admin-test, monitor-test, control-api-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Glance/go.mod
          cache-dependency-path: TMK-Glance/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: tmk-monitor-production
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: tmk-control-api-production
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: tmk-control-api-production
          path: dist
      - name: Build Linux server
        working-directory: TMK-Glance
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w -X tmk-glance/internal/buildinfo.Version=${{ inputs.version }} -X tmk-glance/internal/buildinfo.Commit=${GITHUB_SHA}" -o ../dist/tmk-glance .
      - uses: actions/upload-artifact@v7
        with:
          name: tmk-glance-production
          path: dist/tmk-glance
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    needs: build-server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tmk-glance-production
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: tmk-admin-production-dist
          path: dist/admin
      - uses: actions/download-artifact@v8
        with:
          name: tmk-monitor-production
          path: dist
      - name: Configure deployment identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          install -m 600 deploy/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy production server
        env:
          HOST: 117.72.159.185
          USER: tmk-deploy-production
          RELEASE_ID: ${{ github.sha }}
          APPROVAL_TOKEN: ${{ inputs.approval_token }}
          CONTROL_API_SERVICE_SECRET: ${{ secrets.CONTROL_API_SERVICE_SECRET }}
        run: |
          test -n "$CONTROL_API_SERVICE_SECRET"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          signature=$(printf 'tmk-control-api\n%s\nGET\n/internal/v1/change-requests/authorize' "$timestamp" | openssl dgst -sha256 -hmac "$CONTROL_API_SERVICE_SECRET" -hex | awk '{print $2}')
          curl --fail --show-error --silent "https://${HOST}/tmk-control-api/internal/v1/change-requests/authorize?environment=production&release_id=${RELEASE_ID}&commit_sha=${GITHUB_SHA}&token=${APPROVAL_TOKEN}" -H "X-Service-Timestamp: ${timestamp}" -H "X-Service-Signature: ${signature}"
          chmod 755 dist/tmk-glance
          gzip -9 -c dist/tmk-glance > dist/tmk-glance.gz
          checksum=$(sha256sum dist/tmk-glance.gz | awk '{print $1}')
          remote_artifact="/var/lib/tmk-deploy/production/tmk-glance-${RELEASE_ID}.gz"
          scp dist/tmk-glance.gz "${USER}@${HOST}:${remote_artifact}"
          ssh "${USER}@${HOST}" sudo /usr/local/sbin/tmk-deploy-production "${remote_artifact}" "${checksum}" "${RELEASE_ID}"
          tar -C dist/admin -czf dist/tmk-admin.tar.gz .
          admin_checksum=$(sha256sum dist/tmk-admin.tar.gz | awk '{print $1}')
          remote_admin="/var/lib/tmk-deploy/production/tmk-admin-${RELEASE_ID}.tar.gz"
          scp dist/tmk-admin.tar.gz "${USER}@${HOST}:${remote_admin}"
          ssh "${USER}@${HOST}" sudo /usr/local/sbin/tmk-deploy-admin "${remote_admin}" "${admin_checksum}" "${RELEASE_ID}"
          chmod 755 dist/tmk-monitor
          gzip -9 -c dist/tmk-monitor > dist/tmk-monitor.gz
          monitor_checksum=$(sha256sum dist/tmk-monitor.gz | awk '{print $1}')
          remote_monitor="/var/lib/tmk-deploy/production/tmk-monitor-${RELEASE_ID}.gz"
          scp dist/tmk-monitor.gz "${USER}@${HOST}:${remote_monitor}"
          ssh "${USER}@${HOST}" sudo /usr/local/sbin/tmk-deploy-monitor "${remote_monitor}" "${monitor_checksum}" "${RELEASE_ID}"
          chmod 755 dist/tmk-control-api
          gzip -9 -c dist/tmk-control-api > dist/tmk-control-api.gz
          control_checksum=$(sha256sum dist/tmk-control-api.gz | awk '{print $1}')
          remote_control="/var/lib/tmk-deploy/production/tmk-control-api-${RELEASE_ID}.gz"
          scp dist/tmk-control-api.gz "${USER}@${HOST}:${remote_control}"
          ssh "${USER}@${HOST}" sudo /usr/local/sbin/tmk-deploy-control-api "${remote_control}" "${control_checksum}" "${RELEASE_ID}"
          curl --fail --show-error --silent --retry 5 --retry-delay 2 "https://${HOST}/tmk-production/api/health/ready"
          curl --fail --show-error --silent --retry 5 --retry-delay 2 "https://${HOST}/tmk-control-api/api/health/live"
          curl --fail --show-error --silent --retry 5 --retry-delay 2 "https://${HOST}/tmk-monitor/api/health/ready"

  build-and-publish-client:
    needs: deploy-production
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Client/go.mod
          cache-dependency-path: TMK-Client/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TMK-Client/frontend/package-lock.json
      - name: Install Wails CLI
        working-directory: TMK-Client
        shell: pwsh
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wailsVersion"
      - name: Build production client
        shell: pwsh
        run: ./scripts/build-client-production.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: TMK-Client-${{ inputs.version }}
          path: TMK-Client/bin/release/${{ inputs.version }}/*
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem "TMK-Client/bin/release/$env:VERSION" -File | ForEach-Object FullName
          if ($releaseFiles.Count -eq 0) {
            throw "No release files found"
          }
          gh release create $env:VERSION $releaseFiles --target $env:GITHUB_SHA --generate-notes
