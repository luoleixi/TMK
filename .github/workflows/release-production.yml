name: Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.2.0
        required: true
        type: string
      confirmation:
        description: Type DEPLOY_PRODUCTION to continue
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: production-environment
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "DEPLOY_PRODUCTION"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]

  test-server:
    needs: validate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: integration-password
          MYSQL_DATABASE: tmk_test
          MYSQL_USER: tmk_test
          MYSQL_PASSWORD: integration-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -utmk_test -pintegration-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      TMK_TEST_MYSQL_DSN: tmk_test:integration-password@tcp(127.0.0.1:3306)/tmk_test?parseTime=true
    defaults:
      run:
        working-directory: TMK-Glance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Glance/go.mod
          cache-dependency-path: TMK-Glance/go.sum
      - run: go test -race ./...

  admin-test:
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TMK-Admin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: TMK-Admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check and build production admin
        env:
          ADMIN_BASE_PATH: /tmk-production/admin/
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: tmk-admin-production-dist
          path: TMK-Glance/internal/adminui/dist
          if-no-files-found: error
          retention-days: 7

  build-server:
    needs: [test-server, admin-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Glance/go.mod
          cache-dependency-path: TMK-Glance/go.sum
      - uses: actions/download-artifact@v8
        with:
          name: tmk-admin-production-dist
          path: TMK-Glance/internal/adminui/dist
      - name: Build Linux server
        working-directory: TMK-Glance
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: go build -tags adminui -trimpath -ldflags='-s -w' -o ../dist/tmk-glance .
      - uses: actions/upload-artifact@v7
        with:
          name: tmk-glance-production
          path: dist/tmk-glance
          if-no-files-found: error
          retention-days: 7

  deploy-production:
    needs: build-server
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: tmk-glance-production
          path: dist
      - name: Configure deployment identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          install -m 600 deploy/ssh_known_hosts ~/.ssh/known_hosts
      - name: Deploy production server
        env:
          HOST: 117.72.159.185
          USER: tmk-deploy-production
          RELEASE_ID: ${{ github.sha }}
        run: |
          chmod 755 dist/tmk-glance
          gzip -9 -c dist/tmk-glance > dist/tmk-glance.gz
          checksum=$(sha256sum dist/tmk-glance.gz | awk '{print $1}')
          remote_artifact="/var/lib/tmk-deploy/production/tmk-glance-${RELEASE_ID}.gz"
          scp dist/tmk-glance.gz "${USER}@${HOST}:${remote_artifact}"
          ssh "${USER}@${HOST}" sudo /usr/local/sbin/tmk-deploy-production "${remote_artifact}" "${checksum}" "${RELEASE_ID}"
          curl --fail --show-error --silent --retry 5 --retry-delay 2 "https://${HOST}/tmk-production/api/health/ready"

  build-and-publish-client:
    needs: deploy-production
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: TMK-Client/go.mod
          cache-dependency-path: TMK-Client/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: TMK-Client/frontend/package-lock.json
      - name: Install Wails CLI
        working-directory: TMK-Client
        shell: pwsh
        run: |
          $wailsVersion = go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$wailsVersion"
      - name: Build production client
        shell: pwsh
        run: ./scripts/build-client-production.ps1 -Version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v7
        with:
          name: TMK-Client-${{ inputs.version }}
          path: TMK-Client/bin/release/${{ inputs.version }}/*
          if-no-files-found: error
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $releaseFiles = Get-ChildItem "TMK-Client/bin/release/$env:VERSION" -File | ForEach-Object FullName
          if ($releaseFiles.Count -eq 0) {
            throw "No release files found"
          }
          gh release create $env:VERSION $releaseFiles --target $env:GITHUB_SHA --generate-notes
