server:
  port: ":18080"
  allowed_origins:
    - "https://117.72.159.185"

storage:
  driver: mysql
  db_path: ""
  dsn: ""

object_storage:
  driver: local
  root: "./data/objects"
  max_audio_bytes: 524288000
  max_text_bytes: 10485760
  per_user_quota_bytes: 5368709120
  total_quota_bytes: 21474836480
  min_free_bytes: 2147483648

evaluation:
  workers: 1
  poll_interval_ms: 500
  item_timeout_seconds: 600
  chunk_interval_ms: 100
  lease_seconds: 60
  heartbeat_seconds: 15
  max_attempts: 3
  retry_base_seconds: 5
  reaper_interval_seconds: 10

governance:
  session_retention_days: 180
  evaluation_retention_days: 365
  audit_retention_days: 365
  stale_draft_days: 30
  stuck_job_minutes: 30

auth:
  access_token_ttl_minutes: 15
  refresh_token_ttl_days: 30
  bootstrap_admin_email: ""
  bootstrap_admin_password: ""

asr:
  provider: bailian
  bailian:
    api_key: ""
    max_sentence_silence_ms: 600
    semantic_punctuation_enabled: true
    multi_threshold_mode_enabled: false
    punctuation_prediction_enabled: true
  segmenter:
    enabled: false
    max_runes: 40
    max_duration_ms: 5000
    soft_commit_delay_ms: 300
    min_runes: 1
    punctuation_enabled: true
    semantic_enabled: false
    version: rule-v2

translator:
  provider: bailian
  bailian:
    api_key: ""
