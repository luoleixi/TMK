data_dir: /var/lib/vector

sources:
  tmk_journald:
    type: journald
    include_units:
      - tmk-glance@test.service
      - tmk-glance@production.service
      - tmk-control-api.service
      - tmk-monitor.service
  nginx:
    type: file
    include:
      - /var/log/nginx/access.log
      - /var/log/nginx/error.log
    read_from: end

transforms:
  normalize:
    type: remap
    inputs: [tmk_journald, nginx]
    source: |
      .service = .SYSLOG_IDENTIFIER ?? ._SYSTEMD_UNIT ?? "nginx"
      .environment = .environment ?? "unknown"

sinks:
  local_jsonl:
    type: file
    inputs: [normalize]
    path: /var/log/tmk/combined.jsonl
    encoding:
      codec: json
