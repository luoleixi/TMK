location ^~ /tmk-test/metrics {
    return 404;
}

location = /tmk-test/admin {
    return 301 /tmk-test/admin/;
}

location ^~ /tmk-test/admin/ {
    alias /opt/tmk-admin/test/current/;
    index index.html;
    try_files $uri $uri/ /tmk-test/admin/index.html;
}

location ^~ /tmk-test/admin-api/ {
    proxy_pass http://127.0.0.1:18180/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location ^~ /tmk-test/monitoring/ {
    proxy_pass http://127.0.0.1:19090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location = /tmk-test/monitoring/metrics {
    return 404;
}

location ^~ /tmk-test/monitoring/api/ {
    proxy_pass http://127.0.0.1:19090/api/monitoring/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location ^~ /tmk-test/monitoring/api/health/ {
    proxy_pass http://127.0.0.1:19090/api/health/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

location /tmk-test/ {
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

