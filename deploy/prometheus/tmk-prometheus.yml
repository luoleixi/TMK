global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/tmk-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: tmk-test
    static_configs:
      - targets: ["127.0.0.1:18080"]
        labels:
          environment: test
  - job_name: tmk-production
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          environment: production
  - job_name: tmk-control-api
    static_configs:
      - targets: ["127.0.0.1:17180"]
        labels: {service: control-api}
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]
  - job_name: tmk-monitor
    static_configs:
      - targets: ["127.0.0.1:17090"]
        labels: {service: monitor}
  - job_name: blackbox-public
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - https://117.72.159.185/tmk-test/api/health/live
          - https://117.72.159.185/tmk-control-api/api/health/live
          - https://117.72.159.185/tmk-monitor/api/health/live
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
