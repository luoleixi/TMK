global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/tmk-alerts.yml

scrape_configs:
  - job_name: tmk-test
    static_configs:
      - targets: ["127.0.0.1:18080"]
        labels:
          environment: test
  - job_name: tmk-production
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          environment: production
  - job_name: tmk-admin-api-test
    static_configs:
      - targets: ["127.0.0.1:18180"]
        labels:
          environment: test
          service: admin-api
  - job_name: tmk-admin-api-production
    static_configs:
      - targets: ["127.0.0.1:28180"]
        labels:
          environment: production
          service: admin-api
